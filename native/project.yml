name: NoteAssistant
options:
  minimumXcodeGenVersion: 2.42.0
  bundleIdPrefix: com.local.noteassistant
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "26.6"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.10"
    CURRENT_PROJECT_VERSION: "15"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
targets:
  NoteAssistant:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
        excludes:
          - Resources
      - path: App/Resources
        buildPhase: resources
      - path: Extension
        excludes:
          - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.noteassistant
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ZIPFoundation
      - target: AskAI
        embed: true
        link: false
        codeSign: false
  AskAI:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
        excludes:
          - Resources
      - path: Extension/Resources
        buildPhase: resources
      - path: Shared
      - path: App/SettingsStore.swift
      - path: App/SettingsView.swift
      - path: App/ChatController.swift
      - path: App/ChatPanel.swift
      - path: App/ContextPicker.swift
      - path: App/DocumentPreview.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.noteassistant.AskAI
        INFOPLIST_FILE: Config/Extension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Extension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: ZIPFoundation
  NoteAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.noteassistant.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NoteAssistant
      - package: ZIPFoundation
  NoteAssistantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.noteassistant.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NoteAssistant
    dependencies:
      - target: NoteAssistant
schemes:
  NoteAssistant:
    build:
      targets:
        NoteAssistant: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - NoteAssistantTests
        - NoteAssistantUITests
    archive:
      config: Release
